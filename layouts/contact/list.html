<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>About — Enzo Jerez</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #0b0b0b;
            color: #f2f2f2;
            font-family: Georgia, "Times New Roman", serif;
        }

        nav {
            width: 100%;
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav a {
            color: #f2f2f2;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        nav a:hover {
            opacity: 0.6;
        }

        .about-page {
            padding: 120px 80px;
            max-width: 1100px;
        }

        .eyebrow {
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 25px;
            opacity: 0.6;
        }

        h1 {
            font-size: clamp(3rem, 7vw, 6rem);
            font-weight: normal;
            line-height: 0.95;
            letter-spacing: -0.04em;
            margin-bottom: 70px;
        }

        .about-text {
            max-width: 760px;
        }

        .about-text p {
            font-size: 1.25rem;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        @media (max-width: 700px) {
            nav {
                padding: 25px 6%;
            }

            nav ul {
                gap: 15px;
            }

            nav a {
                font-size: 0.65rem;
            }

            .about-page {
                padding: 80px 6%;
            }

            .about-text p {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">Enzo Jerez</div>

        <ul>
            <li><a href="{{ "" | relURL }}">Home</a></li>
            <li><a href="{{ "work/" | relURL }}">Work</a></li>
            <li><a href="{{ "workshops/" | relURL }}">Workshops</a></li>
            <li><a href="{{ "mentoring/" | relURL }}">Mentoring</a></li>
            <li><a href="{{ "about/" | relURL }}">About</a></li>
            <li><a href="{{ "testimonials/" | relURL }}">Testimonials</a></li>
            <li><a href="{{ "contact/" | relURL }}">Contact</a></li>
        </ul>
    </nav>

    <main class="about-page">
        <div class="eyebrow">{{ .Title }}</div>

        <h1>{{ .Title }}</h1>

        <div class="about-text">
            {{ .Content }}
        </div>
    </main>

</body>
</html>
