<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enzo Jerez — Filmmaker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #0b0b0b;
            color: #f2f2f2;
            font-family: Georgia, "Times New Roman", serif;
        }

        nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav a {
            color: #f2f2f2;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        nav a:hover {
            opacity: 0.6;
        }

        .hero {
            min-height: 100vh;
            background-image: url("{{ "images/FONDO.png" | relURL }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 5%;
        }

        .hero-content {
            max-width: 900px;
        }

        .eyebrow {
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 25px;
            opacity: 0.6;
        }

        h1 {
            font-size: clamp(3.5rem, 10vw, 8rem);
            font-weight: normal;
            line-height: 0.95;
            letter-spacing: -0.04em;
        }

        .subtitle {
            margin-top: 30px;
            font-family: Arial, sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.65;
        }

        .scroll {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            font-family: Arial, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.5;
        }

        @media (max-width: 700px) {
            nav {
                padding: 25px 6%;
            }

            nav ul {
                gap: 15px;
            }

            nav a {
                font-size: 0.65rem;
            }

            .logo {
                font-size: 0.9rem;
            }
        }

        .film:not(:last-child) {
            margin-bottom: 180px;
        }

        .work,
        .about {
            padding-left: 80px;
            padding-right: 80px;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">Enzo Jerez</div>

        <ul>
            <li><a href="{{ "" | relURL }}">Home</a></li>
            <li><a href="{{ "work/" | relURL }}">Work</a></li>
            <li><a href="{{ "workshops/" | relURL }}">Workshops</a></li>
            <li><a href="{{ "mentoring/" | relURL }}">Mentoring</a></li>
            <li><a href="{{ "mentoring/" | relURL }}">Mentoring</a></li>
<li><a href="{{ "asesorias/" | relURL }}">Consulting</a></li>
<li><a href="{{ "testimonials/" | relURL }}">Testimonials</a></li>
            <li><a href="{{ "testimonials/" | relURL }}">Testimonials</a></li>
            <li><a href="{{ "about/" | relURL }}">About</a></li>
            <li><a href="{{ "contact/" | relURL }}">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section class="hero">
            <div class="hero-content">
                <div class="eyebrow">Filmmaker · Audiovisual Artist</div>

                <h1>Enzo Jerez</h1>

                <div class="subtitle">
                    Film · Documentary · Visual Storytelling
                </div>
            </div>

        </section>


    </main>
</body>
</html>
