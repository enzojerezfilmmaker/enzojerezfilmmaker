<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ .Title }} — Enzo Jerez</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #0b0b0b;
            color: #f2f2f2;
            font-family: Georgia, "Times New Roman", serif;
        }

        nav {
            width: 100%;
            padding: 30px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.1rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav a {
            color: #f2f2f2;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        nav a:hover {
            opacity: 0.6;
        }

        .workshops-page {
            padding: 120px 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .eyebrow {
            font-family: Arial, sans-serif;
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 25px;
            opacity: 0.6;
        }

        h1 {
            font-size: clamp(3rem, 7vw, 6rem);
            font-weight: normal;
            line-height: 0.95;
            letter-spacing: -0.04em;
            margin-bottom: 60px;
        }

        .about-text {
            max-width: 760px;
            margin-bottom: 90px;
        }

        .about-text p {
            font-size: 1.25rem;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        .workshop-main {
            width: 100%;
            margin-bottom: 110px;
        }

        .workshop-main-image {
            width: 100%;
            max-height: 700px;
            object-fit: cover;
            display: block;
        }

        .gallery-intro {
            font-family: Arial, sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.55;
            margin-bottom: 25px;
        }

        .workshops-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .workshop-image {
            width: 100%;
            height: 360px;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s ease;
        }

        .workshop-image:hover {
            opacity: 0.75;
        }

        @media (max-width: 900px) {
            .workshops-gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            .workshop-image {
                height: 300px;
            }
        }

        @media (max-width: 700px) {
            nav {
                padding: 25px 6%;
            }

            nav ul {
                gap: 15px;
            }

            nav a {
                font-size: 0.65rem;
            }

            .workshops-page {
                padding: 80px 6%;
            }

            .about-text p {
                font-size: 1.1rem;
            }

            .workshop-main {
                margin-bottom: 70px;
            }

            .workshop-main-image {
                max-height: none;
            }

            .workshops-gallery {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .workshop-image {
                height: auto;
                max-height: 500px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">Enzo Jerez</div>

        <ul>
            <li><a href="{{ "" | relURL }}">Home</a></li>
            <li><a href="{{ "work/" | relURL }}">Work</a></li>
            <li><a href="{{ "workshops/" | relURL }}">Workshops</a></li>
            <li><a href="{{ "mentoring/" | relURL }}">Mentoring</a></li>
            <li><a href="{{ "about/" | relURL }}">About</a></li>
            <li><a href="{{ "testimonials/" | relURL }}">Testimonials</a></li>
            <li><a href="{{ "contact/" | relURL }}">Contact</a></li>
        </ul>
    </nav>

    <main class="workshops-page">

        <section class="workshop-main">
            <img
                src="{{ "images/workshops/" | relURL }}Principal.jpg"
                alt="Filmmaking workshop"
                class="workshop-main-image">
        </section>

        <div class="eyebrow">{{ .Title }}</div>

        <h1>{{ .Title }}</h1>

        <div class="about-text">
            {{ .Content }}
        </div>

        <div class="gallery-intro">
            Selected moments from filmmaking workshops
        </div>

        <section class="workshops-gallery">

            {{ range (slice 1 2 3 4 5 8 10 13 15) }}
                <img
                    src="{{ "images/workshops/" | relURL }}{{ . }}de15.jpeg"
                    alt="Filmmaking workshop"
                    class="workshop-image"
                    loading="lazy">
            {{ end }}

        </section>

    </main>

</body>
</html>
